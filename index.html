            border-left: 4px solid #3ae7e1;
        }

        /* 右側のメインコンテンツエリア */

            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #0f1a30;
            position: relative;
        }

        /* 各機能の画面（最初は非表示、activeがついたら表示） */

            display: none;
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        .tab-panel.active {
            display: flex;
            flex-direction: column;
        }

        /* チャット画面のスタイル */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 20px;
            padding-right: 10px;
        }

        .message {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }

        .message.bot { align-items: flex-start; }
        .message.user { align-items: flex-end; }

        .bubble {
            max-width: 70%;
            padding: 12px 18px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.5;
        }

        .bot .bubble {
            background-color: #1e2e4a;
            color: #ffffff;
            border-bottom-left-radius: 4px;
        }

        .user .bubble {
            background-color: #2b6cb0;
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }

        /* 警告メッセージ（嘘の情報と判断したとき用） */
        .warning-bubble {
            background-color: #742a2a !important;
            border: 1px solid #e53e3e;
            color: #fffaf0 !important;
        }

        /* 入力エリアのスタイル */
        .input-area {
            padding: 20px;
            background-color: #0f1a30;
            display: flex;
            gap: 10px;
            border-top: 1px solid #1a2b4c;
        }

        .input-area input {
            flex: 1;
            background-color: #1a2b4c;
            border: 1px solid #2d3748;
            border-radius: 8px;
            padding: 15px;
            color: white;
            font-size: 16px;
            outline: none;
        }

        .input-area button {
            background-color: #00f0ff;
            color: #0b1426;
            border: none;
            border-radius: 8px;
            padding: 0 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .input-area button:hover {
            background-color: #3ae7e1;
        }

        .input-area button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .chat-status {
            min-height: 24px;
            margin: 0 30px 12px;
            color: #a0d8ff;

<body>

    <div class="sidebar">

    </div>

    <div class="main-content">

        <div id="panel-chat" class="tab-panel active">
            <div class="chat-container" id="chatBox">
                <div class="message bot">
                    <div class="bubble">こんにちは！コウマルAIへようこそ！何についてお話ししますか？</div>

            </div>
            <div id="chatStatus" class="chat-status" aria-live="polite"></div>
            <div id="chatError" class="chat-error" aria-live="assertive"></div>
            <div class="input-area">
                <input type="text" id="userInput" placeholder="メッセージを入力..." onkeypress="handleKeyPress(event)">
                <button id="sendBtn" onclick="sendMessage()">送信</button>
            </div>
        </div>

        <div id="panel-news" class="tab-panel">
            <h2>🌙 コウマルAI ニュース</h2>

                <p>コウマルAIが落ち着いた声で文章を読み上げたり、あなたの声を聴き取ります。</p>
            </div>
        </div>

        <div id="panel-game" class="tab-panel">
            <h2>🌙 コウマルAI ゲームルーム</h2>
            <div class="placeholder-card">
                <i class="fa-solid fa-gamepad"></i>
                <h3>AIミニゲーム</h3>
                <p>AIと対戦するゲームや、シミュレーターをここに合体させることができます！</p>
            </div>
        </div>

    </div>

    <script>
        const WORKER_URL = 'https://kimikara-cf-workers.n2001kouta.workers.dev';
        const API_URL = `${WORKER_URL.replace(/\/\/+$/, '')}/api/chat`;
        const messages = [
            { role: 'bot', text: 'こんにちは！コウマルAIへようこそ！何についてお話ししますか？' }
        ];

        function switchTab(tabName) {
            document.querySelectorAll('.tab-panel').forEach(panel => panel.classList.remove('active'));
            document.querySelectorAll('.menu-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('panel-' + tabName).classList.add('active');
            const eventTarget = event?.currentTarget;
            if (eventTarget) eventTarget.classList.add('active');
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const button = document.getElementById('sendBtn');
            const status = document.getElementById('chatStatus');
            const errorBox = document.getElementById('chatError');
            const text = input.value.trim();
            if (text === '') return;

            errorBox.textContent = '';
            appendMessage(text, 'user');
            messages.push({ role: 'user', text });
            input.value = '';
            button.disabled = true;
            input.disabled = true;
            status.textContent = '送信中…しばらくお待ちください。';

            try {
                const aiResponse = await callWorkerAPI(text);
                appendMessage(aiResponse, 'bot');
                messages.push({ role: 'bot', text: aiResponse });
            } catch (error) {
                const message = error instanceof Error ? error.message : String(error);
                appendMessage('申し訳ありません。AI の応答を取得できませんでした。' + (message ? ` (${message})` : ''), 'bot', true);
                errorBox.textContent = 'エラー: ' + message;
                console.error('Worker API error:', error);
            } finally {
                button.disabled = false;
                input.disabled = false;
                status.textContent = '';
                input.focus();
            }
        }

        function appendMessage(text, sender, isWarning = false) {
            const chatBox = document.getElementById('chatBox');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            const bubbleDiv = document.createElement('div');
            bubbleDiv.className = 'bubble';
            if (isWarning) bubbleDiv.className += ' warning-bubble';
            bubbleDiv.innerText = text;
            messageDiv.appendChild(bubbleDiv);
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function buildWorkerMessage(latestQuestion) {
            const systemPrompt = 'あなたは小中学生にもわかりやすく説明するAI先生です。\nむずかしい言葉を使うときは、短い説明をつけてください。\n答えが長くなりそうなときは、最初に結論を言ってください。\n\n';
            const pairs = [];
            for (let i = messages.length - 1; i > 0 && pairs.length < 6; i--) {
                if (messages[i].role === 'bot' && messages[i - 1]?.role === 'user') {
                    pairs.unshift({ user: messages[i - 1].text, bot: messages[i].text });
                    i -= 1;
                }
            }
            const historyText = pairs.length > 0
                ? 'これまでの会話:\n' + pairs.map(pair => `ユーザー: ${pair.user}\nAI: ${pair.bot}`).join('\n') + '\n\n'
                : '';
            return `${systemPrompt}${historyText}今回の質問:\n${latestQuestion}`;
        }

        async function callWorkerAPI(userInput) {
            const message = buildWorkerMessage(userInput);
            const requestBody = {
                studentId: 'koukiyantian415-code',
                publicAppId: 'html-ai-chat',
                message
            };

            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(requestBody)
            });

            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(`HTTP ${response.status}: ${errorText || response.statusText}`);
            }

            const data = await response.json();
            return parseWorkerResponse(data);
        }

        function parseWorkerResponse(data) {
            if (!data) throw new Error('空のレスポンスを受け取りました。');
            const candidates = [
                data.reply,
                data.answer,
                data.message,
                data.text,
                data.result?.reply,
                data.result?.text,
                data.result?.message,
                data.data?.reply,
                data.data?.text,
                data.data?.message
            ];
            const found = candidates.find(item => typeof item === 'string' && item.trim());
            if (found) return found.trim();
            if (typeof data === 'string' && data.trim()) return data.trim();
            throw new Error('予期しないレスポンス形式です。');
        }
    </script>
