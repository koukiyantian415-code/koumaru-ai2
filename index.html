<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KODO AI</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:sans-serif;
}

body{
display:flex;
height:100vh;
background:white;
color:black;
}

/* サイドバー */

.sidebar{
width:250px;
background:#f3f4f6;
padding:20px;
border-right:1px solid #ddd;
display:flex;
flex-direction:column;
}

.logo{
font-size:28px;
font-weight:bold;
margin-bottom:30px;
}

.menu button{
padding:15px;
margin-bottom:10px;
border:none;
border-radius:10px;
background:white;
cursor:pointer;
font-size:16px;
text-align:left;
border:1px solid #ddd;
}

.menu button:hover{
background:#eee;
}

/* メイン */

.main{
flex:1;
display:flex;
flex-direction:column;
}

/* ヘッダー */

.header{
height:70px;
border-bottom:1px solid #ddd;
display:flex;
align-items:center;
padding:0 20px;
font-size:24px;
font-weight:bold;
}

/* チャット */

.chat-area{
flex:1;
overflow-y:auto;
padding:20px;
display:flex;
flex-direction:column;
background:white;
}

.message{
max-width:70%;
padding:15px;
border-radius:15px;
margin-bottom:15px;
line-height:1.5;
}

.user{
background:#2563eb;
color:white;
align-self:flex-end;
}

.ai{
background:#f3f4f6;
align-self:flex-start;
}

/* 入力 */

.input-area{
display:flex;
padding:20px;
border-top:1px solid #ddd;
background:white;
}

.input-area input{
flex:1;
padding:15px;
border-radius:12px;
border:1px solid #ccc;
font-size:16px;
}

.input-area button{
margin-left:10px;
padding:15px 20px;
border:none;
border-radius:12px;
background:black;
color:white;
font-size:16px;
cursor:pointer;
}

/* スマホ */

@media(max-width:700px){

.sidebar{
display:none;
}

}

</style>
</head>

<body>

<!-- サイド -->

<div class="sidebar">

<div class="logo">
KODO AI
</div>

<div class="menu">

<button onclick="newChat()">
💬 新しいチャット
</button>

<button onclick="aiImage()">
🎨 AI画像
</button>

<button onclick="homeworkAI()">
📚 宿題AI
</button>

<button onclick="storyAI()">
📖 ストーリーAI
</button>

<button onclick="voiceMode()">
🎤 音声モード
</button>

</div>

</div>

<!-- メイン -->

<div class="main">

<div class="header">
KODO AI
</div>

<!-- チャット -->

<div class="chat-area" id="chatArea">

<div class="message ai">
こんにちは！KODO AIです！
</div>

</div>

<!-- 入力 -->

<div class="input-area">

<input
type="text"
id="userInput"
placeholder="メッセージを入力..."
onkeydown="enterSend(event)"
>

<button onclick="startVoice()">
🎤
</button>

<button onclick="sendMessage()">
送信
</button>

</div>

</div>

<script>

const chat =
document.getElementById("chatArea");

/* メッセージ追加 */

function addMessage(text,type){

let msg =
document.createElement("div");

msg.className =
"message " + type;

msg.innerText = text;

chat.appendChild(msg);

chat.scrollTop =
chat.scrollHeight;

}

/* 送信 */

function sendMessage(){

let input =
document.getElementById("userInput");

let text =
input.value.trim();

if(text===""){
return;
}

/* ユーザー */

addMessage(text,"user");

input.value = "";

/* AI */

setTimeout(()=>{

let reply = "";

/* AI返答 */

if(text.includes("こんにちは")){

reply =
"こんにちは！";

}

else if(text.includes("名前")){

reply =
"KODO AIです！";

}

else if(text.includes("絵")){

reply =
"AI画像機能を開きます！";

}

else if(text.includes("宿題")){

reply =
"宿題を手伝います！";

}

else{

reply =
"質問ありがとうございます！";
}

addMessage(reply,"ai");

speak(reply);

},300);

}

/* Enter送信 */

function enterSend(e){

if(e.key==="Enter"){

sendMessage();

}

}

/* 音声読み上げ */

function speak(text){

const speech =
new SpeechSynthesisUtterance(text);

speech.lang = "ja-JP";

speechSynthesis.speak(speech);

}

/* 音声認識 */

function startVoice(){

const recognition =
new webkitSpeechRecognition();

recognition.lang = "ja-JP";

recognition.start();

recognition.onresult =
function(event){

let voiceText =
event.results[0][0].transcript;

document.getElementById("userInput").value =
voiceText;

sendMessage();

};

}

/* メニュー */

function newChat(){

chat.innerHTML = "";

addMessage(
"新しいチャットを開始しました！",
"ai"
);

}

function aiImage(){

addMessage(
"🎨 AI画像モード",
"ai"
);

}

function homeworkAI(){

addMessage(
"📚 宿題AI起動",
"ai"
);

}

function storyAI(){

addMessage(
"📖 ストーリーAI起動",
"ai"
);

}

function voiceMode(){

addMessage(
"🎤 音声モード開始",
"ai"
);

}

</script>

</body>
</html>
