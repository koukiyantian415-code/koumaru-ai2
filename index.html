    <style>
        /* 全体のデザイン設定 */
        body {
            margin: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #0b1426;
            color: #ffffff;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* 左側のサイドバー */
        .sidebar {
            width: 240px;
            background-color: #111c33;
            padding: 20px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #1a2b4c;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #3ae7e1;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .menu-btn {
            background: none;
            border: none;
            color: #a0aec0;
            padding: 12px 15px;
            text-align: left;
            font-size: 16px;
            cursor: pointer;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s;
        }

        .menu-btn:hover, .menu-btn.active {
            background-color: #1a2b4c;
            color: #ffffff;
        }

        .menu-btn.active {
            border-left: 4px solid #3ae7e1;
        }

        /* 右側のメインコンテンツエリア */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #0f1a30;
            position: relative;
        }

        /* 各機能の画面（最初は非表示、activeがついたら表示） */
        .tab-panel {
            display: none;
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        .tab-panel.active {
            display: flex;
            flex-direction: column;
        }

        /* チャット画面のスタイル */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 20px;
            padding-right: 10px;
        }

        .message {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }

        .message.bot { align-items: flex-start; }
        .message.user { align-items: flex-end; }

        .bubble {
            max-width: 70%;
            padding: 12px 18px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.5;
        }

        .bot .bubble {
            background-color: #1e2e4a;
            color: #ffffff;
            border-bottom-left-radius: 4px;
        }

        .user .bubble {
            background-color: #2b6cb0;
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }

        /* 警告メッセージ（嘘の情報と判断したとき用） */
        .warning-bubble {
            background-color: #742a2a !important;
            border: 1px solid #e53e3e;
            color: #fffaf0 !important;
        }

        /* 入力エリアのスタイル */
        .input-area {
            padding: 20px;
            background-color: #0f1a30;
            display: flex;
            gap: 10px;
            border-top: 1px solid #1a2b4c;
        }

        .input-area input {
            flex: 1;
            background-color: #1a2b4c;
            border: 1px solid #2d3748;
            border-radius: 8px;
            padding: 15px;
            color: white;
            font-size: 16px;
            outline: none;
        }

        .input-area button {
            background-color: #00f0ff;
            color: #0b1426;
            border: none;
            border-radius: 8px;
            padding: 0 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .input-area button:hover {
            background-color: #3ae7e1;
        }

        /* 他の機能のダミー表示用スタイル */
        .placeholder-card {
            background: #111c33;
            border: 1px solid #1a2b4c;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            margin-top: 20px;
        }
        
        .placeholder-card i {
            font-size: 48px;
            color: #3ae7e1;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo">🌙 コウマルAI</div>
        <button class="menu-btn active" onclick="switchTab('chat')"><i class="fa-solid fa-comments"></i> AIチャット</button>
        <button class="menu-btn" onclick="switchTab('news')"><i class="fa-solid fa-newspaper"></i> ニュース</button>
        <button class="menu-btn" onclick="switchTab('art')"><i class="fa-solid fa-palette"></i> AIアート</button>
        <button class="menu-btn" onclick="switchTab('voice')"><i class="fa-solid fa-microphone"></i> 音声AI</button>
        <button class="menu-btn" onclick="switchTab('game')"><i class="fa-solid fa-gamepad"></i> ゲーム</button>
    </div>

    <div class="main-content">

        <div id="panel-chat" class="tab-panel active">
            <div class="chat-container" id="chatBox">
                <div class="message bot">
                    <div class="bubble">こんにちは！コウマルAIへようこそ！何についてお話ししますか？</div>
                </div>
            </div>
            <div class="input-area">
                <input type="text" id="userInput" placeholder="メッセージを入力..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()">送信</button>
            </div>
        </div>

        <div id="panel-news" class="tab-panel">
            <h2>🌙 コウマルAI ニュース</h2>
            <div class="placeholder-card">
                <i class="fa-solid fa-newspaper"></i>
                <h3>最新のテクノロジーニュース</h3>
                <p>ここにAIが生成したニュースや、お気に入りのトピックが表示されます。</p>
            </div>
        </div>

        <div id="panel-art" class="tab-panel">
            <h2>🌙 コウマルAI アート</h2>
            <div class="placeholder-card">
                <i class="fa-solid fa-palette"></i>
                <h3>画像生成・アート機能</h3>
                <p>描きたい絵のキーワードを入力すると、AIがイラストを作ります（開発中）。</p>
            </div>
        </div>

        <div id="panel-voice" class="tab-panel">
            <h2>🌙 コウマルAI 音声</h2>
            <div class="placeholder-card">
                <i class="fa-solid fa-microphone"></i>
                <h3>音声認識・読み上げ</h3>
                <p>コウマルAIが落ち着いた声で文章を読み上げたり、あなたの声を聴き取ります。</p>
            </div>
        </div>

        <div id="panel-game" class="tab-panel">
            <h2>🌙 コウマルAI ゲームルーム</h2>
            <div class="placeholder-card">
                <i class="fa-solid fa-gamepad"></i>
                <h3>AIミニゲーム</h3>
                <p>AIと対戦するゲームや、シミュレーターをここに合体させることができます！</p>
            </div>
        </div>

    </div>

    <script>
        // 画面（タブ）を切り替える関数
        function switchTab(tabName) {
            // すべてのパネルから active クラスを消す
            document.querySelectorAll('.tab-panel').forEach(panel => panel.classList.remove('active'));
            // すべてのメニューボタンから active クラスを消す
            document.querySelectorAll('.menu-btn').forEach(btn => btn.classList.remove('active'));

            // 選んだ画面とボタンだけを表示する
            document.getElementById('panel-' + tabName).classList.add('active');
            
            // クリックされたボタンを光らせる
            const eventTarget = event.currentTarget;
            if(eventTarget) eventTarget.classList.add('active');
        }

        // エンターキーでも送信できるようにする
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        // メッセージを送信して、AIが考えて返事をする関数
        function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (text === '') return;

            // 1. ユーザーのメッセージを画面に出す
            appendMessage(text, 'user');
            input.value = '';

            // 2. AIが考えて返事をする（少し時間を遅らせてリアルにする）
            setTimeout(() => {
                const aiResponse = generateAIResponse(text);
                appendMessage(aiResponse.text, 'bot', aiResponse.isWarning);
            }, 600);
        }

        // 画面にメッセージを追加する
        function appendMessage(text, sender, isWarning = false) {
            const chatBox = document.getElementById('chatBox');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;

            const bubbleDiv = document.createElement('div');
            bubbleDiv.className = 'bubble';
            if (isWarning) {
                bubbleDiv.className += ' warning-bubble';
            }
            bubbleDiv.innerText = text;

            messageDiv.appendChild(bubbleDiv);
            chatBox.appendChild(messageDiv);

            // 一番下まで自動スクロール
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // AIの頭脳（文章を考えて、嘘をチェックする）
        function generateAIResponse(inputText) {
            // 嘘の情報（間違った噂など）をその場で判断するキーワードチェック
            const fakeNewsKeywords = ['チーズでできている', '嘘の情報', '1+1は3', 'お化けが出た'];
            
            for (let keyword of fakeNewsKeywords) {
                if (inputText.includes(keyword)) {
                    return {
                        text: `⚠️【注意】コウマルAIのデータチェック機能：入力された内容に間違っている可能性、または確認されていない情報が含まれています。正しい情報を確認してください。`,
                        isWarning: true
                    };
                }
            }

            // よくある質問への賢い返答
            if (inputText.includes('こんにちは') || inputText.includes('ハロー')) {
                return { text: 'こんにちは！今日もコウマルAIと一緒に新しいことを始めましょう。何をお手伝いしますか？', isWarning: false };
            }
            if (inputText.includes('ゲーム')) {
                return { text: 'ゲームですね！左の「ゲーム」メニューを押すと、いつでもゲームコーナーへ行けますよ。どんなゲームが好きですか？', isWarning: false };
            }
            if (inputText.includes('城') || inputText.includes('お城')) {
                return { text: 'お城の歴史はとても深いですよね。安土城や犬山城など、日本の素晴らしいお城についていつでも聞いてください！', isWarning: false };
            }
            if (inputText.includes('おすすめのハンバーガー') || inputText.includes('メニュー')) {
                return { text: 'コウマルAIのおすすめは、やっぱり星のようにキラキラした「スターダストバーガー」や、大迫力の「オーバードライブバーガー」ですね！', isWarning: false };
            }

            // 何にでも使える落ち着いたAIの返事
            return { 
                text: `「${inputText}」についてですね。しっかりと調べて、分かりやすくお答えします。コウマルAIはいつでもあなたをサポートしますよ！`, 
                isWarning: false 
            };
        }
    </script>
</body>
</html>
