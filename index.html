<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>コウマルAI</title>

<style>
body{
margin:0;
font-family:sans-serif;
background:black;
color:white;
overflow:hidden;
}

canvas{
position:fixed;
top:0;
left:0;
z-index:-1;
}

.container{
padding:30px;
text-align:center;
}

h1{
font-size:50px;
color:cyan;
text-shadow:0 0 20px cyan;
}

.chat-box{
margin-top:30px;
}

input{
padding:15px;
width:300px;
border:none;
border-radius:10px;
font-size:18px;
}

button{
padding:15px 25px;
border:none;
border-radius:10px;
background:cyan;
font-size:18px;
cursor:pointer;
margin-left:10px;
}

#response{
margin-top:20px;
font-size:25px;
color:yellow;
}

.card{
margin-top:30px;
padding:20px;
background:rgba(255,255,255,0.1);
border-radius:20px;
backdrop-filter:blur(5px);
}

</style>
</head>

<body>

<canvas id="stars"></canvas>

<div class="container">

<h1>🌙 コウマルAI 🌙</h1>

<p>未来のAIサイト</p>

<div class="chat-box">
<input id="userInput" placeholder="話しかけて！">
<button onclick="talk()">送信</button>

<div id="response"></div>
</div>

<div class="card">
<h2>🤖 AI機能</h2>

<p>✅ AIチャット</p>
<p>✅ AIイラスト</p>
<p>✅ 星空アニメ</p>
<p>✅ コウマル星</p>
<p>✅ 声AI</p>
<p>✅ 本物っぽいAI</p>

<button onclick="speakAI()">
🎤 AIの声
</button>

<button onclick="drawArt()">
🎨 AIアート
</button>

</div>

<canvas id="artCanvas" width="300" height="200"
style="background:white;margin-top:20px;border-radius:20px;">
</canvas>

</div>

<script>

function talk(){

const input =
document.getElementById("userInput").value;

const response =
document.getElementById("response");

if(input.includes("こんにちは")){
response.innerHTML="🌙 こんにちは！";
}

else if(input.includes("宇宙")){
response.innerHTML="🚀 コウマル星へ出発！";
}

else if(input.includes("ウサギ")){
response.innerHTML="🐰 サングラスウサギ発見！";
}

else{
response.innerHTML=
"🤖 コウマルAIが考え中...";
}

speak(response.innerHTML);
}

function speak(text){

const speech =
new SpeechSynthesisUtterance(text);

speech.lang="ja-JP";

speechSynthesis.speak(speech);
}

function speakAI(){
speak("ようこそコウマルAIへ");
}

function drawArt(){

const canvas =
document.getElementById("artCanvas");

const ctx =
canvas.getContext("2d");

ctx.fillStyle="black";
ctx.fillRect(0,0,300,200);

ctx.fillStyle="cyan";

for(let i=0;i<50;i++){

ctx.beginPath();

ctx.arc(
Math.random()*300,
Math.random()*200,
Math.random()*5,
0,
Math.PI*2
);

ctx.fill();
}

ctx.fillStyle="white";

ctx.font="30px sans-serif";

ctx.fillText("🌙",130,100);
}

const canvas =
document.getElementById("stars");

const ctx =
canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let stars=[];

for(let i=0;i<150;i++){

stars.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
size:Math.random()*3
});
}

function animate(){

ctx.clearRect(0,0,
canvas.width,
canvas.height);

ctx.fillStyle="white";

stars.forEach(star=>{

ctx.fillRect(
star.x,
star.y,
star.size,
star.size
);

star.y+=1;

if(star.y>canvas.height){
star.y=0;
}
});

requestAnimationFrame(animate);
}

animate();

</script>

</body>
