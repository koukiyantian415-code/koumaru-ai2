<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>コウマルAI</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:sans-serif;
}

body{
background:#0f172a;
height:100vh;
display:flex;
color:white;
overflow:hidden;
}

/* サイド */

.sidebar{
width:240px;
background:#111827;
padding:20px;
display:flex;
flex-direction:column;
}

.logo{
font-size:28px;
font-weight:bold;
margin-bottom:30px;
color:cyan;
}

.menu button{
padding:15px;
margin-bottom:10px;
border:none;
border-radius:10px;
background:#1f2937;
color:white;
cursor:pointer;
font-size:16px;
transition:0.2s;
}

.menu button:hover{
background:#374151;
}

/* メイン */

.main{
flex:1;
display:flex;
flex-direction:column;
}

/* ヘッダー */

.header{
height:70px;
background:#111827;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 20px;
border-bottom:1px solid #333;
}

.header h1{
font-size:24px;
color:cyan;
}

/* チャット */

.chat-area{
flex:1;
overflow-y:auto;
padding:20px;
display:flex;
flex-direction:column;
scroll-behavior:smooth;
}

/* 吹き出し */

.message{
max-width:75%;
padding:15px;
border-radius:18px;
margin-bottom:15px;
line-height:1.5;
animation:fade 0.2s ease;
}

.user{
background:#2563eb;
align-self:flex-end;
}

.ai{
background:#1e293b;
align-self:flex-start;
border:1px solid #334155;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(10px);
}
to{
opacity:1;
transform:translateY(0);
}
}

/* 入力欄 */

.input-area{
display:flex;
padding:20px;
background:#111827;
border-top:1px solid #333;
}

.input-area input{
flex:1;
padding:15px;
border:none;
border-radius:12px;
font-size:16px;
background:#1e293b;
color:white;
}

.input-area button{
margin-left:10px;
padding:15px 20px;
border:none;
border-radius:12px;
background:cyan;
color:black;
font-size:16px;
cursor:pointer;
font-weight:bold;
}

/* スマホ */

@media(max-width:700px){

.sidebar{
display:none;
}

}

</style>
</head>

<body>

<!-- サイド -->

<div class="sidebar">

<div class="logo">
🌙 コウマルAI
</div>

<div class="menu">
<button>💬 AIチャット</button>
<button onclick="news()">📰 ニュース</button>
<button onclick="art()">🎨 AIアート</button>
<button onclick="voice()">🎤 音声AI</button>
<button onclick="game()">🎮 ゲーム</button>
</div>

</div>

<!-- メイン -->

<div class="main">

<div class="header">
<h1>🌙 コウマルAI</h1>
</div>

<!-- チャット -->

<div class="chat-area" id="chatArea">

<div class="message ai">
こんにちは！コウマルAIへようこそ！
</div>

</div>

<!-- 入力 -->

<div class="input-area">

<input
type="text"
id="userInput"
placeholder="メッセージを入力"
onkeydown="enterSend(event)"
>

<button onclick="sendMessage()">
送信
</button>

</div>

</div>

<script>

const chat =
document.getElementById("chatArea");

function addMessage(text,type){

let msg =
document.createElement("div");

msg.className =
"message " + type;

msg.innerText = text;

chat.appendChild(msg);

chat.scrollTop =
chat.scrollHeight;

}

function sendMessage(){

let input =
document.getElementById("userInput");

let text =
input.value.trim();

if(text===""){
return;
}

/* ユーザー */

addMessage(text,"user");

input.value = "";

/* AI考え中 */

setTimeout(()=>{

let reply = "";

if(text.includes("こんにちは")){

reply = "🌙 こんにちは！";

}

else if(text.includes("宇宙")){

reply = "🚀 コウマル星へ出発！";

}

else if(text.includes("ウサギ")){

reply = "🐰 サングラスウサギ発見！";

}

else if(text.includes("ニュース")){

reply = "📰 AIニュース更新中！";

}

else{

reply =
"🤖 コウマルAIが返答しました！";
}

addMessage(reply,"ai");

speak(reply);

},300);

}

/* Enter送信 */

function enterSend(e){

if(e.key==="Enter"){

sendMessage();

}

}

/* 声 */

function speak(text){

const speech =
new SpeechSynthesisUtterance(text);

speech.lang = "ja-JP";

speechSynthesis.speak(speech);

}

/* メニュー */

function news(){
addMessage("📰 最新ニュースを表示！","ai");
}

function art(){
addMessage("🎨 AIアート生成開始！","ai");
}

function voice(){
speak("こんにちは！コウマルAIです！");
}

function game(){
addMessage("🎮 コウマルゲーム起動！","ai");
}

</script>

</body>
</html>
