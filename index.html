<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>コウマルAI</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:sans-serif;
}

body{
background:black;
overflow:hidden;
color:white;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

/* 星空 */
.stars{
position:absolute;
width:100%;
height:100%;
background:url("https://i.imgur.com/YKY28eT.png");
animation:moveStars 60s linear infinite;
}

@keyframes moveStars{
from{
transform:translateY(0);
}
to{
transform:translateY(-1000px);
}
}

/* メイン */
.main{
position:relative;
z-index:2;
text-align:center;
background:rgba(0,0,0,0.6);
padding:40px;
border-radius:20px;
backdrop-filter:blur(10px);
box-shadow:0 0 30px cyan;
}

h1{
font-size:60px;
margin-bottom:10px;
color:cyan;
text-shadow:0 0 20px cyan;
}

p{
font-size:20px;
margin-bottom:20px;
}

/* ボタン */
button{
padding:15px 30px;
font-size:20px;
border:none;
border-radius:10px;
background:cyan;
color:black;
cursor:pointer;
transition:0.3s;
font-weight:bold;
}

button:hover{
transform:scale(1.1);
background:white;
}

/* ウサギ */
.rabbit{
font-size:80px;
animation:float 3s ease-in-out infinite;
margin-bottom:20px;
}

@keyframes float{
0%{
transform:translateY(0);
}
50%{
transform:translateY(-20px);
}
100%{
transform:translateY(0);
}
}

/* AIチャット */
.chat{
margin-top:20px;
background:#111;
padding:15px;
border-radius:10px;
width:300px;
margin-left:auto;
margin-right:auto;
}

input{
width:100%;
padding:10px;
margin-top:10px;
border:none;
border-radius:5px;
}

.chatText{
margin-top:10px;
color:lime;
}

/* スマホ */
@media(max-width:600px){

h1{
font-size:40px;
}

.main{
width:90%;
padding:20px;
}

}
</style>
</head>

<body>

<div class="stars"></div>

<div class="main">

<div class="rabbit">🐰🚀</div>

<h1>コウマルAI</h1>

<p>宇宙最強AIシステム</p>

<button onclick="hello()">起動</button>

<div class="chat">

<div>AIチャット</div>

<input type="text" id="msg" placeholder="話しかけてね">

<div class="chatText" id="reply"></div>

</div>

</div>

<script>

function hello(){
alert("🚀 コウマルAI 起動！");
}

const msg = document.getElementById("msg");
const reply = document.getElementById("reply");

msg.addEventListener("keypress",function(e){

if(e.key==="Enter"){

let text = msg.value;

if(text.includes("こんにちは")){
reply.innerHTML="🐰 こんにちは！";
}
else if(text.includes("名前")){
reply.innerHTML="🌙 コウマルAIです！";
}
else{
reply.innerHTML="🚀 宇宙通信を受信しました";
}

msg.value="";

}

});

</script>

</body>
</html>
